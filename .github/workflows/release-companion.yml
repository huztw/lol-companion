name: Release Companion

on:
  push:
    branches:
      - main
    paths:
      - src/LoLCompanion.App/LoLCompanion.App.csproj
      - .github/workflows/release-companion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-companion
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Companion
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $projectPath = "src/LoLCompanion.App/LoLCompanion.App.csproj"
          [xml]$project = Get-Content -LiteralPath $projectPath -Raw
          $versionNode = $project.SelectSingleNode("/Project/PropertyGroup/Version")

          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
            throw "Unable to resolve Version from $projectPath"
          }

          $version = $versionNode.InnerText.Trim()
          $tag = "v$version"
          $isPrerelease = $version.Contains("-").ToString().ToLowerInvariant()

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Check out exact release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force

          if ([string]::IsNullOrWhiteSpace((git tag --list $env:RELEASE_TAG))) {
            throw "Release tag $env:RELEASE_TAG does not exist."
          }

          git checkout --detach $env:RELEASE_TAG

      - name: Verify Companion
        shell: pwsh
        run: |
          dotnet test tests/LoLCompanion.Core.Tests/LoLCompanion.Core.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test tests/LoLCompanion.App.Tests/LoLCompanion.App.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet run --project tests/LoLCompanion.ContractSmoke/LoLCompanion.ContractSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable Windows package
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "lol-companion-publish"
          $zipPath = Join-Path $env:RUNNER_TEMP "LoLCompanion-v$env:RELEASE_VERSION-win-x64.zip"

          dotnet publish src/LoLCompanion.App/LoLCompanion.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDirectory `
            --nologo

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $executable = Join-Path $publishDirectory "LoLCompanion.App.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Published executable was not found at $executable"
          }

          Compress-Archive -LiteralPath $executable -DestinationPath $zipPath
          $sha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Write release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          ## 本版重點

          - 從 LCU 對局資料讀取並上傳十位玩家的最終英雄等級。
          - 分析契約升級至 schema 5，支援 Bot 顯示個人 K/D/A、隊伍總 K/D/A 與英雄等級。
          - Bot 仍可接受 schema 4；新版 Companion 使用 schema 5。

          ## 下載

          - Windows x64、self-contained、單一 EXE 可攜版。
          - 不需要另外安裝 .NET。
          - SHA-256：``$env:RELEASE_SHA256``

          > 此版本仍為測試版，建議先完成 Discord ``/pair``，並保持 League Client 與 Companion 開啟。
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip_path }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes_path }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          $title = "LoL Companion v$env:RELEASE_VERSION"

          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null) {
            $editArguments = @(
              "release", "edit", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--title", $title,
              "--notes-file", $env:RELEASE_NOTES
            )

            if ($env:IS_PRERELEASE -eq "true") {
              $editArguments += "--prerelease"
            } else {
              $editArguments += "--latest"
            }

            gh @editArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            gh release upload $env:RELEASE_TAG $env:RELEASE_ZIP `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            $createArguments = @(
              "release", "create", $env:RELEASE_TAG,
              $env:RELEASE_ZIP,
              "--repo", $env:GITHUB_REPOSITORY,
              "--verify-tag",
              "--title", $title,
              "--notes-file", $env:RELEASE_NOTES
            )

            if ($env:IS_PRERELEASE -eq "true") {
              $createArguments += "--prerelease"
            } else {
              $createArguments += "--latest"
            }

            gh @createArguments
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
